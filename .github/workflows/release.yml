name: Package backend release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build versioned deployment artifact
        env:
          REVISION: ${{ github.sha }}
        run: |
          docker build -t "turovnd-realtime:$REVISION" backend
          mkdir release
          docker save "turovnd-realtime:$REVISION" | gzip > release/backend-image.tar.gz
          cp compose.yaml release/compose.yaml
          printf '%s\n' "$REVISION" > release/revision.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: realtime-release
          path: release
          retention-days: 7
