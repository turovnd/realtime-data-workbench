name: turovnd-realtime
x-backend: &backend
  build: ./backend
  image: ${WORKBENCH_IMAGE:-turovnd-realtime:local}
  environment: &backend-environment
    WORKBENCH_DATABASE_URL: postgresql+asyncpg://workbench:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/workbench
    WORKBENCH_ALLOWED_ORIGINS: ${WORKBENCH_ALLOWED_ORIGINS:-["http://localhost:5174","http://127.0.0.1:5174","http://127.0.0.1:4174","http://127.0.0.1:8082"]}
    WORKBENCH_PROVIDER_MODE: ${WORKBENCH_PROVIDER_MODE:-deterministic}
    WORKBENCH_OPENROUTER_MODEL: ${WORKBENCH_OPENROUTER_MODEL:-openai/gpt-4.1-mini}
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  mem_limit: 256m
  cpus: 0.5
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
services:
  db:
    image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: workbench
      POSTGRES_USER: workbench
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [feedback-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U workbench -d workbench"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  migrate:
    <<: *backend
    command: [/app/.venv/bin/python, -m, workbench.db]
    restart: "no"
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *backend
    environment:
      <<: *backend-environment
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports: ["127.0.0.1:${API_PORT:-8002}:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
  worker:
    <<: *backend
    environment:
      <<: *backend-environment
      WORKBENCH_OPENROUTER_API_KEY: ${WORKBENCH_OPENROUTER_API_KEY:-}
      WORKBENCH_OPENROUTER_CALLS_ENABLED: ${WORKBENCH_OPENROUTER_CALLS_ENABLED:-false}
      WORKBENCH_OPENROUTER_MAX_TOKENS: ${WORKBENCH_OPENROUTER_MAX_TOKENS:-800}
      WORKBENCH_LIVE_CALL_BUDGET: ${WORKBENCH_LIVE_CALL_BUDGET:-3}
    command: [/app/.venv/bin/python, -m, workbench.worker]
    stop_grace_period: 15s
    depends_on:
      migrate: {condition: service_completed_successfully}
  web:
    profiles: [local-web]
    build:
      context: .
      dockerfile: web/Dockerfile
    image: turovnd-realtime-web:local
    ports: ["127.0.0.1:${WEB_PORT:-8082}:8080"]
    depends_on:
      api: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 10s
      timeout: 3s
      retries: 3
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
volumes:
  feedback-data:
